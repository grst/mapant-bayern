<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapant Allgäu</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@8.2.0/ol.css" type="text/css">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        .map {
            height: 100vh;
            width: 100vw;
        }
        .info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
            z-index: 1000;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        button {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
            padding: 10px;
            background-color: white;
            border: 1px solid #ccc;
            border-radius: 5px;
            cursor: pointer;
        }
        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.95);
            padding: 8px 12px;
            font-size: 11px;
            line-height: 1.3;
            z-index: 1000;
            border-top: 1px solid #ddd;
            text-align: center;
        }
        .footer a {
            color: #0066cc;
            text-decoration: none;
        }
        .footer a:hover {
            text-decoration: underline;
        }
        .footer-separator {
            margin: 0 5px;
            color: #666;
        }
    </style>
</head>
<body>
    <div id="map" class="map"></div>
    <div class="info">
        <strong>MapAnt Allgäu</strong><br>
        <a href="https://github.com/grst/mapant-bayern/" target="_blank" rel="noopener">Source on GitHub</a>
    </div>
    <button id="toggleGrid">Toggle Grid</button>

    <div class="footer">
        © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap contributors</a>
        <span class="footer-separator">|</span>
        © <a href="https://geodaten.bayern.de/opengeodata/" target="_blank" rel="noopener">Bayerische Vermessungsverwaltung</a> (CC-BY-4.0)
        <span class="footer-separator">|</span>
        Made with <a href="https://github.com/karttapullautin/karttapullautin" target="_blank" rel="noopener">karttapullautin</a> and <a href="https://github.com/grst/karttapullautin2tiles" target="_blank" rel="noopener">karttapullautin2tiles</a>
        <span class="footer-separator">|</span>
        <a href="https://orienteering-allgaeu.de/impressum/" target="_blank" rel="noopener">Impressum</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/ol@8.2.0/dist/ol.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pmtiles@4.4.1/dist/pmtiles.js"></script>
    <script>
        // Create OpenStreetMap background layer
        const osmLayer = new ol.layer.Tile({
            source: new ol.source.OSM()
        });

        // MapAnt tiles live in a single PMTiles archive, read over HTTP range requests
        const PMTILES_URL = 'https://mapant-tiles.orienteering-allgaeu.de/mapant-bayern.pmtiles';
        const TILE_MIN_ZOOM = 12;
        const TILE_MAX_ZOOM = 18;
        // Coverage of the archive (Bavaria), as read from its tile directory
        const DATA_EXTENT = ol.proj.transformExtent(
            [8.96484, 47.21957, 13.88672, 50.62507], 'EPSG:4326', 'EPSG:3857'
        );
        // 1x1 transparent PNG, used for tiles the archive does not contain
        const EMPTY_TILE = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=';
        // The ol.js bundle does not expose ol.TileState; 3 is its ERROR value
        const TILE_STATE_ERROR = 3;

        const pmtilesArchive = new pmtiles.PMTiles(PMTILES_URL);

        // Create the custom tile layer
        const customTileLayer = new ol.layer.Tile({
            extent: DATA_EXTENT,
            source: new ol.source.XYZ({
                // Never fetched: the template only carries z/x/y into tileLoadFunction
                url: '{z}/{x}/{y}',
                minZoom: TILE_MIN_ZOOM,
                maxZoom: TILE_MAX_ZOOM,
                tileLoadFunction: function(imageTile, src) {
                    const coords = src.match(/(\d+)\/(\d+)\/(\d+)$/);
                    const image = imageTile.getImage();
                    pmtilesArchive
                        .getZxy(Number(coords[1]), Number(coords[2]), Number(coords[3]))
                        .then(function(tile) {
                            if (!tile) {
                                image.src = EMPTY_TILE;
                                return;
                            }
                            const objectUrl = URL.createObjectURL(new Blob([tile.data]));
                            image.addEventListener(
                                'load', function() { URL.revokeObjectURL(objectUrl); }, { once: true }
                            );
                            image.src = objectUrl;
                        })
                        .catch(function(error) {
                            console.error('PMTiles tile load failed for ' + src, error);
                            imageTile.setState(TILE_STATE_ERROR);
                        });
                }
            }),
            opacity: 1 // Make custom tiles slightly transparent to see OSM underneath
        });

        // Create debug tile layer to show tile boundaries
        const debugLayer = new ol.layer.Tile({
            source: new ol.source.TileDebug({
                tileGrid: customTileLayer.getSource().getTileGrid()
            }),
            visible: false // Debug grid is disabled by default
        });

        // Parse URL parameters to restore position
        function getUrlParams() {
            const params = new URLSearchParams(window.location.hash.substring(1));
            return {
                zoom: params.get('zoom'),
                lat: params.get('lat'),
                lon: params.get('lon')
            };
        }

        const urlParams = getUrlParams();
        const initialCenter = (urlParams.lat && urlParams.lon) 
            ? ol.proj.fromLonLat([parseFloat(urlParams.lon), parseFloat(urlParams.lat)])
            : ol.proj.fromLonLat([10.2142, 47.5635]); // Immenstadt im Allgäu coordinates
        // Default to the archive's lowest zoom so the map tiles are visible on load
        const initialZoom = urlParams.zoom ? parseInt(urlParams.zoom) : TILE_MIN_ZOOM;

        // Create the map with OSM as background and custom tiles on top
        const map = new ol.Map({
            target: 'map',
            layers: [
                osmLayer,      // Background layer
                customTileLayer, // Custom tiles overlay
                debugLayer     // Debug grid showing tile boundaries
            ],
            view: new ol.View({
                center: initialCenter,
                zoom: initialZoom,
                minZoom: 1,
                maxZoom: 18
            })
        });

        // Add controls
        map.addControl(new ol.control.FullScreen());
        map.addControl(new ol.control.ScaleLine());
        map.addControl(new ol.control.ZoomSlider());

        // Toggle debug grid visibility
        document.getElementById('toggleGrid').addEventListener('click', function() {
            debugLayer.setVisible(!debugLayer.getVisible());
        });

        // Update URL hash automatically when map view changes
        map.on('moveend', function() {
            const view = map.getView();
            const center = view.getCenter();
            const lonLat = ol.proj.toLonLat(center);
            const zoom = view.getZoom();
            window.location.hash = `zoom=${Math.round(zoom)}&lat=${lonLat[1].toFixed(5)}&lon=${lonLat[0].toFixed(5)}`;
        });
    </script>
</body>
</html>
