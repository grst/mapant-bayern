<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="About Mapant Bayern – data sources, licences and how the map is made." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title data-i18n="title.about">About – Mapant Bayern</title>
  </head>
  <body class="page-about">

    <header class="navbar">
      <button
        class="nav-toggle"
        id="nav-toggle"
        type="button"
        aria-expanded="false"
        aria-controls="site-nav"

      >
        <span class="nav-toggle-bars" aria-hidden="true"></span>

      <a class="brand" href="/">Mapant Bayern</a>
