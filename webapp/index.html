<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Mapant Bayern – an automatically generated orienteering map of Bavaria, made with karttapullautin."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title data-i18n="title.map">Mapant Bayern</title>
  </head>
  <body>
    <a class="skip-link" href="#map">Skip to map</a>

    <header class="navbar">
      <button
        class="nav-toggle"
        id="nav-toggle"
        type="button"
        aria-expanded="false"
        aria-controls="site-nav"
        data-i18n-label="nav.menu"
      >
        <span class="nav-toggle-bars" aria-hidden="true"></span>
      </button>
      <a class="brand" href="/">Mapant Bayern</a>
      <nav class="site-nav" id="site-nav">
        <a href="/about.html" data-i18n="nav.about">About</a>
        <a href="https://github.com/grst/mapant-bayern" target="_blank" rel="noopener" data-i18n="nav.source">
          Source on GitHub
        </a>
        <a href="https://mapant.net" target="_blank" rel="noopener" data-i18n="nav.otherMaps">Other mapant maps</a>
        <div class="lang-switch" id="lang-switch" role="group" data-i18n-label="nav.language">
          <button type="button" data-lang="de">DE</button>
          <button type="button" data-lang="en">EN</button>
        </div>
      </nav>
    </header>
    <div class="nav-backdrop" id="nav-backdrop" hidden></div>

    <main class="map-wrap">
      <div id="map" class="map" tabindex="0"></div>
      <p class="zoom-hint" id="zoom-hint" hidden data-i18n="hint.zoomIn"></p>
    </main>

    <footer class="footer">
      <div class="attribution" id="attribution"></div>
      <div class="footer-static">
        <span data-i18n-html="footer.madeWith"></span>
        <span class="sep">|</span>
        <a href="https://orienteering-allgaeu.de/impressum/" target="_blank" rel="noopener" data-i18n="footer.impressum">
          Impressum
        </a>
      </div>
    </footer>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
