<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="lower">
      <path d="M 28,4 4,28 h 24 z" />
    </clipPath>
  </defs>
  <rect width="32" height="32" rx="4" fill="#ffffff" />
  <!-- Lower triangle: German flag (black / red / gold) -->
  <g clip-path="url(#lower)">
    <rect x="4" y="4" width="24" height="8" fill="#000000" />
    <rect x="4" y="12" width="24" height="8" fill="#dd0000" />
    <rect x="4" y="20" width="24" height="8" fill="#ffcc00" />
  </g>
  <!-- Orienteering control marker -->
  <rect x="4" y="4" width="24" height="24" fill="none" stroke="#1b1b1b" stroke-width="1.5" />
</svg>
