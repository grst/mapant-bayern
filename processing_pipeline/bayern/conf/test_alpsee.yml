# A manual test region: Immenstadt, the Grosser Alpsee and the hills north of it, from 47.552616 N
# 10.141566 E to 47.617981 N 10.272019 E (88 tiles, all LAS 1.2). It holds what the map has
# gone wrong on: contours across the lake, a razed railway north of Immenstadt, gardens around the
# houses, power lines. Small enough for a workstation.
#
#   nextflow run grst/mapant-nf -profile podman -params-file conf/test_alpsee.yml \
#       --osm_pbf input/bayern-latest.osm.pbf
#
# The tiles CSV names each tile's ini (`pullauta_ini`, the same for every tile); `pullauta_ini` below is only
# the default for a tile that names none. Open results_alpsee/map/mapant.pmtiles in the webapp
# (`VITE_MAPANT_PMTILES`, see webapp/README.md) or with results_alpsee/map/index.html.

tiles_csv: input/laz_tiles.csv
pullauta_ini: conf/pullauta.bayern.ini
vectorconf: ../kp/osm.txt

region_bbox: '10.141566,47.552616,10.272019,47.617981'
region_bbox_crs: lonlat

grid_size: 8
pullauta_processes: 7

base_zoom: 12
max_zoom: 15

download_jobs: 8

map_title: 'mapant test -- Grosser Alpsee'
attribution: 'LiDAR &copy; <a href="https://geodaten.bayern.de">Bayerische Vermessungsverwaltung</a>'
outdir: results_alpsee
